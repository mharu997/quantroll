[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantroll"
version = "0.1.0"
description = "Fast, temporally stable rolling-window quant tools: stable rolling PCA, performance measures, and target scorecards for financial time series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M. Harutyunyan", email = "mharu997@gmail.com" }]
keywords = [
    "quant",
    "finance",
    "pca",
    "rolling-window",
    "time-series",
    "performance-measures",
    "portfolio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=0.20"]
umap = ["umap-learn>=0.5"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.4", "pandas>=2.0", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantroll"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY", "UP"]
ignore = ["E501"]
